kind = "web"
previewPath = "/"
title = "Local AI Health Companion"
version = "1.0.0"
id = "artifacts/health-companion"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23553

[services.development]
run = "pnpm --filter @workspace/health-companion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/health-companion", "run", "build" ]
publicDir = "artifacts/health-companion/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23553"
BASE_PATH = "/"
